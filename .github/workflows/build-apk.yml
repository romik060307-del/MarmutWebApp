name: Build Marmut APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Give APK a clear filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Marmut.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marmut-APK
          path: Marmut.apk
          if-no-files-found: error
          retention-days: 14
